name: Ci-pipe

on: push

jobs:
  workflow-testing:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: install dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify Secret
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          if [ -z "$DAGSHUB_PAT" ]; then
            echo "DAGSHUB_PAT is EMPTY"
            exit 1
          else
            echo "DAGSHUB_PAT is present"
          fi

      - name: run dvc
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          dvc repro